<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julynight BrandConnect Post Studio V5.0 (Pro Bridge)</title>
    <style>
        :root {
            --bg-dark: #121415;
            --card-bg: #1c1f21;
            --panel-bg: #262a2e;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --mint: #98e6be;
            --mint-dark: #6bc497;
            --purple: #c084fc;
            --border: #33383d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
        }

        @media (max-width: 1180px) {
            body { height: auto; overflow: auto; }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        header h1 { font-size: 1.2rem; color: var(--mint); font-weight: 800; }
        header p { font-size: 0.8rem; color: var(--text-sub); }

        /* 1 / 2 / 3 한 화면 3단 그리드 레이아웃 */
        .layout-3col {
            display: grid;
            grid-template-columns: 350px 1.15fr 1fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 1180px) {
            .layout-3col { grid-template-columns: 1fr; }
        }

        .col-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            overflow-y: auto;
        }

        .col-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .helper-badge {
            display: inline-block;
            background: rgba(152, 230, 190, 0.15);
            color: var(--mint);
            font-size: 0.74rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .form-group { margin-bottom: 11px; flex-shrink: 0; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        input[type="text"], select, textarea {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 0.83rem;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--mint); }
        textarea { resize: vertical; line-height: 1.45; }

        .btn {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .btn-primary { background-color: var(--mint); color: #111415; }
        .btn-primary:hover { background-color: var(--mint-dark); }

        .btn-pro {
            background: rgba(192, 132, 252, 0.18);
            color: var(--purple);
            border: 1px solid rgba(192, 132, 252, 0.5);
            margin-bottom: 8px;
        }
        .btn-pro:hover { background: rgba(192, 132, 252, 0.28); }

        .btn-secondary {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            font-size: 0.78rem;
            padding: 7px 10px;
        }
        .btn-secondary:hover { border-color: var(--mint); color: var(--mint); }

        .status-msg {
            margin-top: 8px;
            font-size: 0.78rem;
            padding: 9px 10px;
            border-radius: 7px;
            background-color: rgba(152, 230, 190, 0.08);
            border-left: 3px solid var(--mint);
            color: var(--text-main);
            display: none;
            word-break: keep-all;
            flex-shrink: 0;
        }

        /* 2열: 2x2 컴팩트 이미지 카드 그리드 */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .img-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .img-card canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 5px;
            display: block;
        }

        .card-edit-inputs {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-edit-inputs input {
            padding: 4px 7px;
            font-size: 0.75rem;
            border-radius: 4px;
            background: var(--card-bg);
        }

        .card-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

        .img-card button, .img-card .upload-label-btn {
            width: 100%;
            padding: 5px 4px;
            font-size: 0.72rem;
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            display: inline-block;
        }

        .img-card button.copy-btn {
            background-color: rgba(152, 230, 190, 0.14);
            color: var(--mint);
            border-color: rgba(152, 230, 190, 0.4);
            font-size: 0.76rem;
            padding: 6px;
        }

        /* 3열: 네이버 블로그 원고 미리보기 창 */
        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .naver-preview-wrapper {
            background-color: #ffffff;
            color: #222222;
            border-radius: 10px;
            padding: 22px 20px;
            flex: 1;
            overflow-y: auto;
            box-shadow: inset 0 0 0 1px #e2e8f0;
        }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:baseline; gap:12px;">
            <h1>Julynight BrandConnect Post Studio V5.0</h1>
            <p>제미나이 프로 100% 직결 · 한 화면 3단 워크스테이션 (@camper_julynight)</p>
        </div>
        <div style="font-size:0.78rem; color:var(--mint); font-weight:700;">
            💎 API 무제한 (제미나이 프로 전용) | 1·2·3단 와이드 뷰
        </div>
    </header>

    <div class="layout-3col">
        <!-- [1열] STEP 1. 입력 및 제미나이 프로 브릿지 -->
        <div class="col-card">
            <div class="col-header">
                <span class="helper-badge">STEP 1. 제품 & 어투 설정 (강제 반영)</span>
            </div>

            <div class="form-group">
                <label>🎯 1. 정확한 브랜드 + 제품명 (필수)</label>
                <input type="text" id="productNameInput" placeholder="예: 몬벨 버사라이트 자켓, 파란테 V2 배낭">
            </div>

            <div class="form-group">
                <label>🗣️ 2. 말투 및 문장 스타일 (그대로 강제 적용)</label>
                <textarea id="styleRuleInput" rows="3" oninput="saveUserPrefs()">칠월밤 블로그 특유의 담백하고 차분한 실사용자 어투(~합니다, ~입니다, ~편입니다, ~보입니다)로 작성. 과장된 홈쇼핑식 표현이나 어색한 번역투·출처 불명의 약어는 절대 쓰지 말 것.</textarea>
            </div>

            <div class="form-group">
                <label>📌 3. 본문에 무조건 넣을 강조 포인트 · 내 생각 (필수 반영)</label>
                <textarea id="mustIncludeInput" rows="4" placeholder="여기에 적은 단어, 스펙, 내 주관적인 생각은 AI가 절대 생략하지 않고 소구점과 본문에 무조건 핵심으로 집어넣습니다. (예: 3~5kg 장거리 하이킹에 적합한 이유, 10D 원단 촉감 등)"></textarea>
            </div>

            <div class="form-group">
                <label>🏔️ 4. 기본 카드 배경 테마</label>
                <select id="bgThemeSelect" onchange="refreshAllNatureBackgrounds()">
                    <option value="nature">웅장한 대자연·산악·숲 풍경 (24종)</option>
                    <option value="minimal">다크 차콜 미니멀 그리드</option>
                </select>
            </div>

            <div style="border-top:1px solid var(--border); padding-top:10px; margin-top:4px; display:flex; flex-direction:column; gap:6px; flex:1;">
                <label style="color:var(--purple);">💎 제미나이 프로 2단계 직결 워크플로우</label>
                <button class="btn btn-pro" onclick="copyProPrompt()">
                    1️⃣ [명령어 복사] ➔ 제미나이 프로 채팅창에 붙여넣기
                </button>
                <textarea id="proJsonInput" style="flex:1; min-height:70px; font-size:0.76rem;" placeholder="제미나이 프로가 출력한 { ... } JSON 코드를 복사해 여기에 붙여넣으세요."></textarea>
                <button class="btn btn-primary" onclick="applyProJson()">
                    2️⃣ [결과 적용] ➔ 우측 카드 4장 + 블로그 원고 즉시 생성
                </button>
            </div>

            <div id="statusBox" class="status-msg"></div>
        </div>

        <!-- [2열] STEP 2. 소구점별 스펙 카드 4장 개별 수정 & 복사 -->
        <div class="col-card">
            <div class="col-header">
                <span class="helper-badge">STEP 2. 소구점 스펙 카드 (문구/배경 개별 수정)</span>
                <button class="btn-secondary" style="width:auto; border-radius:6px; cursor:pointer;" onclick="refreshAllNatureBackgrounds()">
                    🔄 4장 배경 일괄 변경
                </button>
            </div>

            <div class="image-gallery">
                <!-- 카드 0 -->
                <div class="img-card">
                    <canvas id="cardCanvas0" width="800" height="800"></canvas>
                    <div class="card-edit-inputs">
                        <input type="text" id="cardBadge0" value="GEAR REVIEW" oninput="redrawSingleCard(0)">
                        <input type="text" id="cardTitle0" value="" oninput="redrawSingleCard(0)" placeholder="메인 타이틀">
                        <input type="text" id="cardSpec0" value="" oninput="redrawSingleCard(0)" placeholder="하단 스펙">
                    </div>
                    <div class="card-btn-row">
                        <button type="button" onclick="changeSingleNatureBg(0)">🔄 배경교체</button>
                        <label class="upload-label-btn">📁 내사진<input type="file" accept="image/*" style="display:none;" onchange="uploadSingleCardBg(event, 0)"></label>
                    </div>
                    <button type="button" class="copy-btn" onclick="copyCanvasImage('cardCanvas0')">📋 썸네일 복사</button>
                </div>

                <!-- 카드 1 -->
                <div class="img-card">
                    <canvas id="cardCanvas1" width="800" height="800"></canvas>
                    <div class="card-edit-inputs">
                        <input type="text" id="cardBadge1" value="POINT 01" oninput="redrawSingleCard(1)">
                        <input type="text" id="cardTitle1" value="" oninput="redrawSingleCard(1)" placeholder="소구점 1 제목">
                        <input type="text" id="cardSpec1" value="" oninput="redrawSingleCard(1)" placeholder="핵심 스펙 1">
                    </div>
                    <div class="card-btn-row">
                        <button type="button" onclick="changeSingleNatureBg(1)">🔄 배경교체</button>
                        <label class="upload-label-btn">📁 내사진<input type="file" accept="image/*" style="display:none;" onchange="uploadSingleCardBg(event, 1)"></label>
                    </div>
                    <button type="button" class="copy-btn" onclick="copyCanvasImage('cardCanvas1')">📋 소구점 1 복사</button>
                </div>

                <!-- 카드 2 -->
                <div class="img-card">
                    <canvas id="cardCanvas2" width="800" height="800"></canvas>
                    <div class="card-edit-inputs">
                        <input type="text" id="cardBadge2" value="POINT 02" oninput="redrawSingleCard(2)">
                        <input type="text" id="cardTitle2" value="" oninput="redrawSingleCard(2)" placeholder="소구점 2 제목">
                        <input type="text" id="cardSpec2" value="" oninput="redrawSingleCard(2)" placeholder="핵심 스펙 2">
                    </div>
                    <div class="card-btn-row">
                        <button type="button" onclick="changeSingleNatureBg(2)">🔄 배경교체</button>
                        <label class="upload-label-btn">📁 내사진<input type="file" accept="image/*" style="display:none;" onchange="uploadSingleCardBg(event, 2)"></label>
                    </div>
                    <button type="button" class="copy-btn" onclick="copyCanvasImage('cardCanvas2')">📋 소구점 2 복사</button>
                </div>

                <!-- 카드 3 -->
                <div class="img-card">
                    <canvas id="cardCanvas3" width="800" height="800"></canvas>
                    <div class="card-edit-inputs">
                        <input type="text" id="cardBadge3" value="POINT 03" oninput="redrawSingleCard(3)">
                        <input type="text" id="cardTitle3" value="" oninput="redrawSingleCard(3)" placeholder="소구점 3 제목">
                        <input type="text" id="cardSpec3" value="" oninput="redrawSingleCard(3)" placeholder="핵심 스펙 3">
                    </div>
                    <div class="card-btn-row">
                        <button type="button" onclick="changeSingleNatureBg(3)">🔄 배경교체</button>
                        <label class="upload-label-btn">📁 내사진<input type="file" accept="image/*" style="display:none;" onchange="uploadSingleCardBg(event, 3)"></label>
                    </div>
                    <button type="button" class="copy-btn" onclick="copyCanvasImage('cardCanvas3')">📋 소구점 3 복사</button>
                </div>
            </div>
        </div>

        <!-- [3열] STEP 3. 네이버 블로그 원고 (우측 배치 완료) -->
        <div class="col-card">
            <div class="col-header">
                <span class="helper-badge">STEP 3. 네이버 블로그 원고 (빨간색 위치 표시)</span>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary" style="flex:2;" onclick="copyRichBlogContent()">
                    📋 서식 통째로 복사하기 (Ctrl+V)
                </button>
                <button class="btn btn-secondary" style="flex:1;" onclick="copyHashtagsOnly()">
                    #️⃣ 해시태그 복사
                </button>
            </div>

            <div class="naver-preview-wrapper" id="blogPostContainer" contenteditable="true"></div>
        </div>
    </div>

    <script>
        const PURE_NATURE_POOL = [
            "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1533240332313-0db49b459ad6?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&w=900&q=80",
            "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=900&q=80"
        ];

        let activeBgImages = [null, null, null, null];
        let currentPostData = null;

        window.onload = async () => {
            const savedStyle = localStorage.getItem('julynight_style_rule');
            if (savedStyle) document.getElementById('styleRuleInput').value = savedStyle;

            currentPostData = getInitialGuideData();
            await loadRandomNatureBackgrounds();
            syncCardInputsFromData(currentPostData);
            renderAll();
        };

        function saveUserPrefs() {
            localStorage.setItem('julynight_style_rule', document.getElementById('styleRuleInput').value);
        }

        function showStatus(msg, isError = false) {
            const box = document.getElementById('statusBox');
            box.style.display = 'block';
            box.style.borderLeftColor = isError ? '#ef4444' : '#98e6be';
            box.innerHTML = msg;
        }

        function loadImageAsync(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        async function loadRandomNatureBackgrounds() {
            const shuffled = [...PURE_NATURE_POOL].sort(() => 0.5 - Math.random());
            activeBgImages = await Promise.all(shuffled.slice(0, 4).map(url => loadImageAsync(url)));
        }

        async function refreshAllNatureBackgrounds() {
            const mode = document.getElementById('bgThemeSelect').value;
            if (mode === 'nature') {
                await loadRandomNatureBackgrounds();
                showStatus("✅ 새로운 대자연 풍경 4장이 적용되었습니다.");
            } else {
                activeBgImages = [null, null, null, null];
            }
            for (let i = 0; i < 4; i++) redrawSingleCard(i);
        }

        async function changeSingleNatureBg(cardIndex) {
            const randomUrl = PURE_NATURE_POOL[Math.floor(Math.random() * PURE_NATURE_POOL.length)];
            activeBgImages[cardIndex] = await loadImageAsync(randomUrl);
            redrawSingleCard(cardIndex);
        }

        function uploadSingleCardBg(event, cardIndex) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    activeBgImages[cardIndex] = img;
                    redrawSingleCard(cardIndex);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function syncCardInputsFromData(data) {
            document.getElementById('cardBadge0').value = "GEAR REVIEW";
            document.getElementById('cardTitle0').value = data.productName;
            document.getElementById('cardSpec0').value = data.category || "FIELD SPEC ANALYSIS";

            data.points.forEach((pt, idx) => {
                const i = idx + 1;
                document.getElementById(`cardBadge${i}`).value = pt.badge || `POINT 0${i}`;
                document.getElementById(`cardTitle${i}`).value = pt.shortTitle || "";
                document.getElementById(`cardSpec${i}`).value = pt.keySpec || "";
            });
        }

        function redrawSingleCard(index) {
            const badge = document.getElementById(`cardBadge${index}`).value;
            const title = document.getElementById(`cardTitle${index}`).value;
            const spec = document.getElementById(`cardSpec${index}`).value;
            const subHeader = index === 0 ? "JULYNIGHT ARCHIVE" : (currentPostData ? currentPostData.productName : "");
            drawSpecCard(`cardCanvas${index}`, badge, title, spec, subHeader, activeBgImages[index]);
        }

        /**
         * 사용자 어투와 강조 포인트를 최우선 순위로 강제 각인시키는 프롬프트 생성기
         */
        function copyProPrompt() {
            const productName = document.getElementById('productNameInput').value.trim();

        async function applyProJson() {
            const raw = document.getElementById('proJsonInput').value.trim();

                const match = raw.match(/\{[\s\S]*\}/);
                if (!match) throw new Error("{ } 형식의 JSON 데이터를 찾을 수 없습니다.");
                const parsed = JSON.parse(match[0]);

                syncCardInputsFromData(parsed);

        function drawSpecCard(canvasId, badgeText, mainTitle, subSpec, productName, bgImg) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            ctx.fillStyle = "#161819";
            ctx.fillRect(0, 0, W, H);

            if (bgImg) {
                ctx.save();
                const scale = Math.max(W / bgImg.width, H / bgImg.height);
                const nw = bgImg.width * scale;
                const nh = bgImg.height * scale;
                ctx.drawImage(bgImg, (W - nw) / 2, (H - nh) / 2, nw, nh);

                const overlay = ctx.createLinearGradient(0, 0, 0, H);
                overlay.addColorStop(0, "rgba(15, 18, 20, 0.65)");
                overlay.addColorStop(0.45, "rgba(15, 18, 20, 0.42)");
                overlay.addColorStop(1, "rgba(12, 15, 17, 0.85)");
                ctx.fillStyle = overlay;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            } else {
                ctx.strokeStyle = "rgba(152, 230, 190, 0.06)";
                ctx.lineWidth = 1;
                for (let x = 80; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
                for (let y = 80; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
            }

            ctx.strokeStyle = "rgba(152, 230, 190, 0.45)";
            ctx.lineWidth = 2.5;
            ctx.strokeRect(42, 42, W - 84, H - 84);

            ctx.fillStyle = "#98e6be";
            ctx.fillRect(82, 88, 176, 44);
            ctx.fillStyle = "#111415";
            ctx.font = "800 21px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(badgeText, 82 + 88, 118);

            ctx.fillStyle = "#cbd5e1";
            ctx.font = "600 24px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText((productName || "").slice(0, 28), 82, 188);

            ctx.save();
            ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
            ctx.shadowBlur = 14;
            ctx.fillStyle = "#ffffff";
            ctx.font = "800 50px -apple-system, BlinkMacSystemFont, sans-serif";
            wrapText(ctx, mainTitle || "", 82, 280, W - 164, 66);
            ctx.restore();

            ctx.fillStyle = "#98e6be";
            ctx.fillRect(82, 455, 85, 6);

            ctx.fillStyle = "rgba(15, 18, 20, 0.78)";
            ctx.fillRect(82, 505, W - 164, 132);
            ctx.strokeStyle = "rgba(152, 230, 190, 0.4)";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(82, 505, W - 164, 132);

            ctx.fillStyle = "#98e6be";
            ctx.font = "700 20px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.fillText("KEY SPECIFICATION", 112, 548);

            ctx.fillStyle = "#f8fafc";
            ctx.font = "600 28px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.fillText((subSpec || "").slice(0, 28), 112, 598);

            ctx.fillStyle = "rgba(226, 232, 240, 0.8)";
            ctx.font = "600 19px -apple-system, BlinkMacSystemFont, sans-serif";
            ctx.textAlign = "right";
            ctx.fillText("JULYNIGHT GEAR ARCHIVE  |  @camper_julynight", W - 82, H - 74);
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        async function copyRichBlogContent() {
            const container = document.getElementById('blogPostContainer');
            try {
                const htmlBlob = new Blob([container.innerHTML], { type: 'text/html' });
                const textBlob = new Blob([container.innerText], { type: 'text/plain' });
                await navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })]);
                showStatus("✅ <strong>원고가 복사되었습니다!</strong> 네이버 블로그에 붙여넣기(Ctrl+V) 하세요.");
            } catch (err) {
                const range = document.createRange();
                range.selectNodeContents(container);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                document.execCommand('copy');
                sel.removeAllRanges();
                showStatus("✅ 원고가 복사되었습니다!");
            }
        }

        function copyHashtagsOnly() {
            if (!window.currentHashtags) return;
            navigator.clipboard.writeText(window.currentHashtags);
            showStatus("✅ 해시태그가 복사되었습니다!");
        }

        function copyCanvasImage(canvasId) {
            const canvas = document.getElementById(canvasId);
            canvas.toBlob(async (blob) => {
                try {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    showStatus("✅ <strong>이미지가 복사되었습니다!</strong> 네이버 블로그에 붙여넣기(Ctrl+V) 하세요.");
                } catch (err) {
                    const link = document.createElement('a');
                    link.download = `${canvasId}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                }
            });
        }
