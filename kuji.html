<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가챠 랜덤뽑기</title>
  <style>
    :root {
      --navy: #0f2942;
      --yellow: #fde047;
      --mint: #76b89d;
      --coral: #ff6b6b;
      --cream: #fdfbf7;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", Roboto, sans-serif;
      background-color: var(--navy);
      color: #1e293b;
      min-height: 100vh;
      padding-bottom: 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* 전체 배경 (자동으로 찾은 배경 이미지 적용) */
    #bgBlurLayer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      filter: blur(3px);
      z-index: -1;
    }

    header {
      background: rgba(15, 41, 66, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255,255,255,0.15);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 {
      font-size: 1rem;
      font-weight: 900;
      color: var(--yellow);
      letter-spacing: -0.3px;
    }
    .mode-btn {
      background: #ffffff;
      color: var(--navy);
      border: 2px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--border);
    }
    .mode-btn:active { transform: translateY(2px); box-shadow: none; }

    .container { max-width: 500px; margin: 0 auto; padding: 14px; }
    .hidden { display: none !important; }

    /* 상단 메인 배너 */
    .hero-banner {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid var(--border);
      box-shadow: 0 6px 0 rgba(0,0,0,0.35);
      margin-bottom: 16px;
      background: var(--cream);
    }
    .hero-banner img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* 남은 경품 현황판 */
    .status-board {
      background: rgba(253, 251, 247, 0.96);
      border: 3px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 18px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.3);
    }
    .status-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .prize-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .prize-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      border: 2px solid var(--border);
      box-shadow: 0 2px 0 var(--border);
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .prize-chip.empty {
      opacity: 0.35;
      text-decoration: line-through;
      box-shadow: none;
    }

    /* 뽑기 버튼 그리드 */
    .ticket-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .ticket {
      aspect-ratio: 1 / 1.12;
      background: #ffffff;
      border-radius: 16px;
      border: 3px solid var(--border);
      box-shadow: 0 5px 0 var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 6px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
      overflow: hidden;
    }
    .ticket:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--border);
    }
    .ticket-num {
      align-self: flex-start;
      background: var(--yellow);
      color: var(--navy);
      font-size: 0.72rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      line-height: 1.1;
    }
    .ticket-logo {
      width: 78%;
      height: 62%;
      object-fit: contain;
      margin: auto 0;
      transition: transform 0.2s;
    }
    .ticket:hover .ticket-logo { transform: scale(1.07) rotate(-3deg); }
    .ticket-label {
      font-size: 0.68rem;
      font-weight: 900;
      color: var(--navy);
      background: #f1f5f9;
      width: 100%;
      text-align: center;
      border-radius: 6px;
      padding: 2px 0;
    }

    /* 이미 뽑힌 티켓 */
    .ticket.opened {
      background: rgba(226, 232, 240, 0.82);
      border: 2px dashed #64748b;
      box-shadow: none;
      cursor: default;
      justify-content: center;
    }
    .ticket.opened:active { transform: none; }
    .opened-num {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .opened-badge {
      font-size: 0.85rem;
      font-weight: 900;
      padding: 5px 10px;
      border-radius: 999px;
      color: #fff;
      border: 2px solid var(--border);
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* 관리자 설정 화면 */
    .admin-card {
      background: #ffffff;
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.35);
    }
    .title-input-box {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 2px dashed #e2e8f0;
    }
    .title-input-box label {
      display: block;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .title-input-box input {
      width: 100%;
      padding: 10px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .admin-row {
      display: grid;
      grid-template-columns: 42px 1fr 1.2fr 64px 34px;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }
    .admin-row input[type="color"] {
      width: 38px; height: 38px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; background: none;
    }
    .admin-row input[type="text"], .admin-row input[type="number"] {
      width: 100%; padding: 9px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    }
    .del-btn {
      background: #fee2e2; color: #ef4444; border: 2px solid #ef4444; width: 34px; height: 38px;
      border-radius: 8px; font-weight: 900; cursor: pointer;
    }
    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .btn {
      width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px;
      font-size: 0.95rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 0 var(--border);
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--border); }
    .btn-add { background: #f1f5f9; color: #1e293b; }
    .btn-primary { background: var(--mint); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.25); }

    /* 모달 공통 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 41, 66, 0.88);
      backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 28px;
      border: 4px solid var(--border);
      box-shadow: 0 10px 0 var(--border);
      padding: 28px 22px;
      text-align: center;
      position: relative;
    }

    /* 카운트다운 애니메이션 */
    .count-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin: 0 auto 8px;
      animation: wiggle 0.4s infinite ease-in-out;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-10deg) scale(1.05); }
      50% { transform: rotate(10deg) scale(0.95); }
    }
    .count-number {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--coral);
      line-height: 1;
      margin: 8px 0;
      text-shadow: 3px 3px 0 var(--border);
      animation: pulsePop 1s infinite;
    }
    @keyframes pulsePop {
      0% { transform: scale(0.5); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .count-sub {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy);
    }

    /* 당첨 결과 연출 */
    .result-pop {
      animation: popIn 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.28);
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .result-logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      margin-bottom: 4px;
    }
    .result-badge {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 999px;
      color: #fff;
      font-size: 2.1rem;
      font-weight: 900;
      margin: 12px 0;
      border: 3px solid var(--border);
      box-shadow: 0 5px 0 var(--border);
      text-shadow: 0 2px 3px rgba(0,0,0,0.3);
    }
    .result-desc {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 22px;
      word-break: keep-all;
    }
  </style>
</head>
<body>

  <div id="bgBlurLayer"></div>

  <header>
    <h1 id="headerTitle">⚡ 가챠 랜덤뽑기</h1>
    <button class="mode-btn" onclick="toggleView()" id="toggleBtn">⚙️ 관리 설정</button>
  </header>

  <div class="container">
    <!-- 1. 실제 뽑기 화면 -->
    <div id="drawView">
      <div class="hero-banner">
        <img id="heroBannerImg" alt="메인 배너">
      </div>

      <div class="status-board">
        <div class="status-title">
          <span>🎁 남은 경품 현황</span>
          <span id="remainCount">0 / 0장</span>
        </div>
        <div class="prize-chips" id="statusChips"></div>
      </div>

      <div class="ticket-grid" id="ticketGrid"></div>
    </div>

    <!-- 2. 관리자 설정 화면 -->
    <div id="adminView" class="hidden">
      <div class="admin-card">
        <div class="title-input-box">
          <label>📌 상단 페이지 제목 설정</label>
          <input type="text" id="titleInput" placeholder="예: 산너미 가챠 랜덤뽑기" oninput="updateTitle(this.value)">
        </div>

        <h3 style="margin-bottom: 8px;
